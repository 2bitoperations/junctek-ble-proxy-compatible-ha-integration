name: Auto-release on main push

on:
  push:
    branches: [main]

jobs:
  release:
    # Skip if this push is the workflow's own version-bump commit.
    if: "!contains(github.event.head_commit.message, '[ci bump]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can push back the bump commit.
          fetch-depth: 0

      - name: Bump patch version in manifest.json
        id: version
        run: |
          OLD=$(jq -r '.version' custom_components/junctek_ble/manifest.json)
          MAJOR=$(echo "$OLD" | cut -d. -f1)
          MINOR=$(echo "$OLD" | cut -d. -f2)
          PATCH=$(echo "$OLD" | cut -d. -f3)
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          jq --arg v "$NEW" '.version = $v' custom_components/junctek_ble/manifest.json \
            > /tmp/manifest.json && mv /tmp/manifest.json custom_components/junctek_ble/manifest.json
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/junctek_ble/manifest.json
          git commit -m "chore: bump to ${{ steps.version.outputs.version }} [ci bump]"
          git push

      - name: Package integration
        run: |
          cd custom_components/junctek_ble
          zip -r ../../junctek_ble.zip .

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: junctek_ble.zip
          generate_release_notes: true
